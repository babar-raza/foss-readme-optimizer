schema_version: 2
policy_profile: aspose-3d-foss

required_elements:
  license_mentioned:
    detected_license: MIT
  products_org_link:
    url: "https://products.aspose.org/3d/java/"
    family_url: "https://products.aspose.org/3d/"
    label: "Aspose.3D FOSS for Java"
  products_com_link:
    url: "https://products.aspose.com/3d/java/"
    family_url: "https://products.aspose.com/3d"
    label: "Aspose.3D for Java"
    utm:
      utm_source: github
      utm_medium: readme
      utm_campaign: foss-readme-optimizer
  relationship_explained:
    min_sentences: 2
    talking_points: [open_source_scope, commercial_upgrade_path]

secondary_links:
  - docs.aspose.org
  - docs.aspose.com
  - reference.aspose.com
  - releases.aspose.com
  - blog.aspose.org
  - kb.aspose.org
  - forum.aspose.com

block:
  word_limit:
    min: 20
    max: 120
  prohibited_terms:
    - "guarantee"
    - "100%"
    - "best in the world"
    - "free forever"
    - "no bugs"
  link_whitelist_domains:
    - products.aspose.com
    - docs.aspose.com
    - reference.aspose.com
    - releases.aspose.com
    - products.aspose.org
    - docs.aspose.org
    - kb.aspose.org
    - blog.aspose.org
    - forum.aspose.com

product_truth:
  audience:
    - Java developers building 3D import, export, and scene-processing applications.
  problems_solved:
    - Create, load, inspect, transform, and save 3D scenes with an open-source Java API.
  capabilities:
    - value: Create, load, inspect, transform, and save 3D scenes.
      evidence_paths:
        - src/main/java/com/aspose/threed/Scene.java
        - src/test/java/com/aspose/threed/SceneTest.java
      required_symbols:
        - "public class Scene"
        - "public void save(String filePath)"
    - value: Model scene geometry and materials through mesh and material APIs.
      evidence_paths:
        - src/main/java/com/aspose/threed/Mesh.java
        - src/main/java/com/aspose/threed/Material.java
        - src/test/java/com/aspose/threed/MaterialTests.java
      required_symbols:
        - "public class Mesh"
        - "public abstract class Material"
  formats:
    - value: Import and export glTF and GLB scenes.
      evidence_paths:
        - FILE_FORMATS.md
        - src/test/java/com/aspose/threed/GltfFormatTest.java
      required_symbols:
        - "glTF/GLB"
        - "GltfFormatTest"
    - value: Import and export binary and ASCII STL scenes.
      evidence_paths:
        - FILE_FORMATS.md
        - src/test/java/com/aspose/threed/StlFormatTest.java
      required_symbols:
        - "STL"
        - "StlFormatTest"
    - value: Import and export Collada scenes.
      evidence_paths:
        - src/test/java/com/aspose/threed/ColladaTests.java
      required_symbols:
        - "ColladaTests"
  limitations:
    - value: Rendering and full commercial-API parity remain incomplete.
      evidence_paths:
        - TODO.md
        - docs/foss-java-progress.md
      required_symbols:
        - "render"
        - "UnsupportedOperationException"
  minimal_example:
    language: java
    class_name: ReadmeExample
    code: |
      import com.aspose.threed.Scene;

      public class ReadmeExample {
          public static void main(String[] args) throws Exception {
              Scene scene = new Scene();
              scene.save("scene.stl");
          }
      }
    evidence_paths:
      - src/main/java/com/aspose/threed/Scene.java
    required_symbols:
      - "public Scene()"
      - "public void save(String filePath)"

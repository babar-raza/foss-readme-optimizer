schema_version: 2
policy_profile: aspose-pdf-foss

required_elements:
  license_mentioned:
    detected_license: MIT
  products_org_link:
    # Confirmed missing in the real README as of the 2026-07-17 audit — this is
    # the one gap this profile exists to close.
    url: "https://products.aspose.org/pdf/java/"
    family_url: "https://products.aspose.org/pdf/"
    label: "Aspose.PDF FOSS for Java"
  products_com_link:
    # Confirmed present in the real README (audit finding) — used here only for
    # referential-integrity cross-checking, not re-rendered.
    url: "https://products.aspose.com/pdf/java/"
    family_url: "https://products.aspose.com/pdf"
    label: "Aspose.PDF for Java"
    utm:
      utm_source: github
      utm_medium: readme
      utm_campaign: foss-readme-optimizer
  relationship_explained:
    min_sentences: 2
    talking_points: [open_source_scope, commercial_upgrade_path]

secondary_links:
  - docs.aspose.org
  - docs.aspose.com
  - reference.aspose.com
  - releases.aspose.com
  - blog.aspose.org
  - kb.aspose.org
  - forum.aspose.com

block:
  word_limit:
    min: 20
    max: 120
  prohibited_terms:
    - "guarantee"
    - "100%"
    - "best in the world"
    - "free forever"
    - "no bugs"
  link_whitelist_domains:
    - products.aspose.com
    - docs.aspose.com
    - reference.aspose.com
    - releases.aspose.com
    - products.aspose.org
    - docs.aspose.org
    - kb.aspose.org
    - blog.aspose.org
    - forum.aspose.com

product_truth:
  audience:
    - Java developers creating, reading, modifying, and saving PDF documents.
  problems_solved:
    - Process PDF documents with an open-source Java API focused on the core PDF specification.
  capabilities:
    - value: Create, open, modify, and save PDF documents.
      evidence_paths:
        - src/main/java/org/aspose/pdf/Document.java
        - src/test/java/org/aspose/pdf/tests/DocumentTest.java
        - src/test/java/org/aspose/pdf/tests/generation/DocumentSaveIdempotenceTest.java
      required_symbols:
        - "public class Document"
        - "public Document()"
        - "public void save(String filePath)"
    - value: Add pages and text content to PDF documents.
      evidence_paths:
        - src/main/java/org/aspose/pdf/PageCollection.java
        - src/main/java/org/aspose/pdf/Page.java
        - src/main/java/org/aspose/pdf/text/TextFragment.java
      required_symbols:
        - "public class PageCollection"
        - "public Page add()"
        - "public class TextFragment"
  formats:
    - value: Read and write PDF documents.
      evidence_paths:
        - src/main/java/org/aspose/pdf/Document.java
        - docs/limitations.md
      required_symbols:
        - "PDF in / PDF out"
        - "public void save(String filePath)"
    - value: Produce PDF/A documents for long-term preservation workflows.
      evidence_paths:
        - docs/pdfa.md
        - src/main/java/org/aspose/pdf/PdfFormat.java
      required_symbols:
        - "PDF/A"
        - "PDF_A"
  limitations:
    - value: OCR, non-PDF conversion, XFA rendering, 3D annotations, and PDF/X are out of scope.
      evidence_paths:
        - docs/limitations.md
      required_symbols:
        - "OCR"
        - "XFA forms"
        - "PDF/X"
  minimal_example:
    language: java
    class_name: ReadmeExample
    code: |
      import org.aspose.pdf.Document;
      import org.aspose.pdf.Page;
      import org.aspose.pdf.text.TextFragment;

      public class ReadmeExample {
          public static void main(String[] args) throws Exception {
              try (Document document = new Document()) {
                  Page page = document.getPages().add();
                  page.getParagraphs().add(new TextFragment("Hello, PDF"));
                  document.save("hello.pdf");
              }
          }
      }
    evidence_paths:
      - src/main/java/org/aspose/pdf/Document.java
      - src/main/java/org/aspose/pdf/PageCollection.java
      - src/main/java/org/aspose/pdf/Page.java
      - src/main/java/org/aspose/pdf/text/TextFragment.java
    required_symbols:
      - "public Document()"
      - "public Page add()"
      - "public TextFragment(String text)"
      - "public void save(String filePath)"

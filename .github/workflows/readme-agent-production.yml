name: README Agent Production Runtime

on:
  schedule:
    # Off the top of the hour because GitHub documents that scheduled runs
    # can be delayed or dropped during high load.
    - cron: "17 5 * * *"
    # Weekly full-source audit uses a distinct non-peak window and dedup key.
    - cron: "43 4 * * 0"
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional allow-listed org/repo; empty means the active portfolio"
        required: false
        type: string
      proof_mode:
        description: "Governed proof mode; ACT and hosted staging values are fail-closed"
        required: false
        type: string
      qualified_cohort_manifest:
        description: "QualifiedTrustedCohortV1 manifest used by governed cohort proof modes"
        required: false
        type: string
      staging_target_manifest:
        description: "Disposable StagingTargetManifestV1 used only by staging-effect proof modes"
        required: false
        type: string
  workflow_call:
    inputs:
      repository:
        description: "Optional allow-listed org/repo; empty means the active portfolio"
        required: false
        type: string
      proof_mode:
        required: false
        type: string
      qualified_cohort_manifest:
        required: false
        type: string
      staging_target_manifest:
        required: false
        type: string
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true
      ACT_GITHUB_READ_TOKEN:
        required: false
      STAGING_GITHUB_WRITE_TOKEN:
        required: false
      LLM_BASE_URL:
        required: true
      LLM_API_KEY:
        required: true
      DEAD_MAN_HEARTBEAT_URL:
        required: false
  repository_dispatch:
    types: [readme_agent_repository_changed]

permissions:
  contents: read

jobs:
  registry:
    name: Reconcile authorized repository sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ env.ACT != 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Mint control-scoped GitHub App discovery token
        id: discovery-token
        if: ${{ env.ACT != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: aspose-cells-foss
          repositories: Aspose.Cells-FOSS-for-Java
          permission-contents: read
      - name: Reconcile sources and settle durable intake
        env:
          README_AGENT_PRODUCTION_AUTH: ${{ env.ACT == 'true' && 'act_local' || 'github_app' }}
          README_AGENT_ACT_GITHUB_TOKEN: ${{ secrets.ACT_GITHUB_READ_TOKEN }}
          README_AGENT_GITHUB_APP_TOKEN: ${{ steps.discovery-token.outputs.token }}
        run: |
          fixture_arg=""
          if [ "${ACT:-}" = "true" ]; then
            fixture_arg="--act-fixture-inventory"
          fi
          readme-agent registry-preflight \
            --registry data/products.json \
            --force-refresh \
            $fixture_arg \
            --output runs/registry-revisions/workflow-preflight.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: registry-revision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/products.json
            runs/registry-revisions/

  recover:
    name: Recover unfinished durable work
    needs: registry
    runs-on: ubuntu-latest
    permissions:
      # This token is scoped to this control repository and writes only the
      # refs/readme-agent-state namespace through GitStateBackend.
      contents: write
    outputs:
      matrix: ${{ steps.recovery-matrix.outputs.matrix }}
      has_recovery: ${{ steps.recovery-matrix.outputs.has_recovery }}
      is_act_proof: ${{ steps.runtime-mode.outputs.is_act_proof }}
      is_registry_intake: ${{ steps.runtime-mode.outputs.is_registry_intake }}
      cohort_manifest: ${{ steps.runtime-mode.outputs.cohort_manifest }}
      is_staging_effect: ${{ steps.runtime-mode.outputs.is_staging_effect }}
      is_hosted_staging_effect: ${{ steps.runtime-mode.outputs.is_hosted_staging_effect }}
      staging_target_manifest: ${{ steps.runtime-mode.outputs.staging_target_manifest }}
    steps:
      - id: runtime-mode
        name: Fail-closed runtime-mode admission
        env:
          REQUESTED_PROOF_MODE: ${{ inputs.proof_mode || github.event.client_payload.proof_mode }}
          REQUESTED_COHORT_MANIFEST: ${{ inputs.qualified_cohort_manifest || github.event.client_payload.qualified_cohort_manifest }}
          REQUESTED_STAGING_MANIFEST: ${{ inputs.staging_target_manifest || github.event.client_payload.staging_target_manifest }}
        run: |
          requested="${REQUESTED_PROOF_MODE:-}"
          manifest="${REQUESTED_COHORT_MANIFEST:-${README_AGENT_QUALIFIED_COHORT_MANIFEST:-}}"
          if [ "${ACT:-}" = "true" ]; then
            if [ -n "$requested" ] && [ "$requested" != "act_registry_intake" ] && [ "$requested" != "act_qualified_cohort" ] && [ "$requested" != "act_staging_effect" ]; then
              echo "::error::act accepts only governed ACT proof modes"
              exit 2
            fi
            if [ "$requested" != "act_registry_intake" ] && [ -z "$manifest" ]; then
              echo "::error::act_qualified_cohort requires a frozen cohort manifest"
              exit 2
            fi
            echo "is_act_proof=true" >> "$GITHUB_OUTPUT"
            echo "cohort_manifest=$manifest" >> "$GITHUB_OUTPUT"
            if [ "$requested" = "act_registry_intake" ]; then
              echo "is_registry_intake=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_registry_intake=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$requested" = "act_staging_effect" ]; then
              test -n "$REQUESTED_STAGING_MANIFEST" || {
                echo "::error::act_staging_effect requires a staging target manifest"
                exit 2
              }
              echo "is_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=$REQUESTED_STAGING_MANIFEST" >> "$GITHUB_OUTPUT"
            else
              echo "is_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$requested" = "act_registry_intake" ] || [ "$requested" = "act_qualified_cohort" ] || [ "$requested" = "act_staging_effect" ]; then
              echo "::error::ACT proof modes are forbidden outside ACT=true"
              exit 2
            fi
            echo "is_act_proof=false" >> "$GITHUB_OUTPUT"
            echo "is_registry_intake=false" >> "$GITHUB_OUTPUT"
            if [ "$requested" = "github_app_staging_effect" ]; then
              test -n "$manifest" || {
                echo "::error::github_app_staging_effect requires a frozen cohort manifest"
                exit 2
              }
              test -n "$REQUESTED_STAGING_MANIFEST" || {
                echo "::error::github_app_staging_effect requires a staging target manifest"
                exit 2
              }
              echo "cohort_manifest=$manifest" >> "$GITHUB_OUTPUT"
              echo "is_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=$REQUESTED_STAGING_MANIFEST" >> "$GITHUB_OUTPUT"
            else
              test -z "$requested" || {
                echo "::error::unsupported hosted proof mode"
                exit 2
              }
              echo "cohort_manifest=" >> "$GITHUB_OUTPUT"
              echo "is_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          clean: ${{ steps.runtime-mode.outputs.is_act_proof != 'true' }}
      - uses: actions/download-artifact@v4
        with:
          name: registry-revision-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Restore immutable cohort inputs
        if: ${{ (steps.runtime-mode.outputs.is_act_proof == 'true' && steps.runtime-mode.outputs.is_registry_intake != 'true') || steps.runtime-mode.outputs.is_hosted_staging_effect == 'true' }}
        env:
          COHORT_MANIFEST: ${{ steps.runtime-mode.outputs.cohort_manifest }}
        run: |
          readme-agent restore-qualified-cohort \
            --manifest "$COHORT_MANIFEST" \
            --input-manifest plans/investigations/evidence/trp-04p-act-workflow-inputs-v1/manifest.json \
            --runtime-root runs/readme-poc \
            --state-remote runs/act-poc/state.git \
            --output runs/act-poc/restore.json
          if [ "${ACT:-}" = "true" ]; then
            printf '%s\n' "$COHORT_MANIFEST" \
              > "runs/act-poc/shared-workspace-${GITHUB_RUN_ID}.marker"
            echo "README_AGENT_STATE_REMOTE=$PWD/runs/act-poc/state.git" >> "$GITHUB_ENV"
          fi
      - name: Initialize isolated ACT registry-intake state
        if: ${{ steps.runtime-mode.outputs.is_registry_intake == 'true' }}
        run: |
          mkdir -p runs/act-registry-intake
          test -d runs/act-registry-intake/state.git || git init --bare runs/act-registry-intake/state.git
          printf '%s\n' "act_registry_intake" > "runs/act-registry-intake/shared-workspace-${GITHUB_RUN_ID}.marker"
          echo "README_AGENT_STATE_REMOTE=$PWD/runs/act-registry-intake/state.git" >> "$GITHUB_ENV"
      - name: Validate repository_dispatch identity
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
        run: |
          if [ -z "$DELIVERY_ID" ]; then
            echo "::error::repository_dispatch requires client_payload.delivery_id for durable deduplication"
            exit 2
          fi
      - name: Recover stale accepted, processing, and retryable triggers
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository || github.event.client_payload.repository }}
          COHORT_MANIFEST: ${{ steps.runtime-mode.outputs.cohort_manifest }}
          IS_ACT_PROOF: ${{ steps.runtime-mode.outputs.is_act_proof }}
          IS_REGISTRY_INTAKE: ${{ steps.runtime-mode.outputs.is_registry_intake }}
          IS_STAGING_EFFECT: ${{ steps.runtime-mode.outputs.is_staging_effect }}
        run: |
          mkdir -p runs/workflow
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            export README_AGENT_STATE_REMOTE="$PWD/runs/act-registry-intake/state.git"
          elif [ "$IS_ACT_PROOF" = "true" ]; then
            # Bind the disposable state remote in the consuming shell too.
            # GITHUB_ENV propagation varies across local workflow runners;
            # recovery must never silently fall back to the control origin.
            export README_AGENT_STATE_REMOTE="$PWD/runs/act-poc/state.git"
          fi
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            if [ -n "$REQUESTED_REPOSITORY" ]; then
              readme-agent recovery-sweep --only "$REQUESTED_REPOSITORY" --output runs/workflow/recovery-candidates.json
            else
              readme-agent recovery-sweep --output runs/workflow/recovery-candidates.json
            fi
          elif [ "$IS_ACT_PROOF" = "true" ] || [ "$IS_STAGING_EFFECT" = "true" ]; then
            repositories=$(readme-agent qualified-cohort-matrix \
              --manifest "$COHORT_MANIFEST" | jq -r '[.include[].repo] | join(",")')
            readme-agent recovery-sweep \
              --only "$repositories" --output runs/workflow/recovery-candidates.json
          elif [ -n "$REQUESTED_REPOSITORY" ]; then
            readme-agent recovery-sweep \
              --only "$REQUESTED_REPOSITORY" --output runs/workflow/recovery-candidates.json
          else
            readme-agent recovery-sweep --output runs/workflow/recovery-candidates.json
          fi
      - id: recovery-matrix
        name: Emit resumable trigger matrix
        run: |
          matrix=$(jq -c '{include: [.recovery_candidates[] | {
            repo: .repository,
            dedup_key: .trigger_dedup_key,
            owner: (.repository | split("/")[0]),
            name: (.repository | split("/")[1])
          }]}' runs/workflow/recovery-candidates.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<<"$matrix")" -gt 0 ]; then
            echo "has_recovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_recovery=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/workflow/recovery-candidates.json

  resume:
    name: Resume ${{ matrix.repo }}
    needs: recover
    if: ${{ needs.recover.outputs.has_recovery == 'true' && needs.recover.outputs.is_staging_effect != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.recover.outputs.matrix) }}
    concurrency:
      group: readme-agent-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ needs.recover.outputs.is_act_proof != 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Bind isolated ACT state remote
        if: ${{ needs.recover.outputs.is_act_proof == 'true' }}
        run: |
          if [ "${{ needs.recover.outputs.is_registry_intake }}" = "true" ]; then
            state_root=runs/act-registry-intake
          else
            state_root=runs/act-poc
          fi
          test -f "$state_root/shared-workspace-${GITHUB_RUN_ID}.marker" || {
            echo "::error::act proof requires a shared bound workspace; invoke act with --bind"
            exit 2
          }
          echo "README_AGENT_STATE_REMOTE=$PWD/$state_root/state.git" >> "$GITHUB_ENV"
      - name: Mint repository-scoped read-only GitHub App token
        id: target-token
        if: ${{ needs.recover.outputs.is_act_proof != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: read
      - name: Resume the original durable trigger
        env:
          IS_ACT_PROOF: ${{ needs.recover.outputs.is_act_proof }}
          IS_REGISTRY_INTAKE: ${{ needs.recover.outputs.is_registry_intake }}
          COHORT_MANIFEST: ${{ needs.recover.outputs.cohort_manifest }}
          README_AGENT_PRODUCTION_AUTH: ${{ needs.recover.outputs.is_act_proof == 'true' && 'act_local' || 'github_app' }}
          README_AGENT_ACT_GITHUB_TOKEN: ${{ secrets.ACT_GITHUB_READ_TOKEN }}
          README_AGENT_GITHUB_APP_TOKEN: ${{ steps.target-token.outputs.token }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --resume-trigger-key "${{ matrix.dedup_key }}" \
              --no-registry-heal --execution-profile act_registry_intake \
              --max-readme-poc-stage INTAKE_READY
          elif [ "$IS_ACT_PROOF" = "true" ]; then
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --resume-trigger-key "${{ matrix.dedup_key }}" \
              --no-registry-heal --execution-profile act_poc \
              --max-readme-poc-stage TRUSTED_NO_OP_PROVEN \
              --qualified-cohort-manifest "$COHORT_MANIFEST"
          else
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --resume-trigger-key "${{ matrix.dedup_key }}" \
              --no-registry-heal --execution-profile github_observe
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: recovery-evidence-${{ matrix.owner }}__${{ matrix.name }}-${{ github.run_id }}
          path: runs/evidence/${{ github.run_id }}/${{ matrix.owner }}__${{ matrix.name }}/

  plan:
    name: Build authoritative repository matrix
    needs: [registry, recover]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      schedule_window: ${{ steps.identity.outputs.schedule_window }}
      is_act_proof: ${{ steps.runtime-mode.outputs.is_act_proof }}
      is_registry_intake: ${{ steps.runtime-mode.outputs.is_registry_intake }}
      cohort_manifest: ${{ steps.runtime-mode.outputs.cohort_manifest }}
      is_staging_effect: ${{ steps.runtime-mode.outputs.is_staging_effect }}
      is_hosted_staging_effect: ${{ steps.runtime-mode.outputs.is_hosted_staging_effect }}
      staging_target_manifest: ${{ steps.runtime-mode.outputs.staging_target_manifest }}
    steps:
      - id: runtime-mode
        name: Fail-closed runtime-mode admission
        env:
          REQUESTED_PROOF_MODE: ${{ inputs.proof_mode || github.event.client_payload.proof_mode }}
          REQUESTED_COHORT_MANIFEST: ${{ inputs.qualified_cohort_manifest || github.event.client_payload.qualified_cohort_manifest }}
          REQUESTED_STAGING_MANIFEST: ${{ inputs.staging_target_manifest || github.event.client_payload.staging_target_manifest }}
        run: |
          requested="${REQUESTED_PROOF_MODE:-}"
          manifest="${REQUESTED_COHORT_MANIFEST:-${README_AGENT_QUALIFIED_COHORT_MANIFEST:-}}"
          if [ "${ACT:-}" = "true" ]; then
            test -z "$requested" || test "$requested" = "act_registry_intake" || test "$requested" = "act_qualified_cohort" || test "$requested" = "act_staging_effect"
            if [ "$requested" != "act_registry_intake" ]; then test -n "$manifest"; fi
            echo "is_act_proof=true" >> "$GITHUB_OUTPUT"
            echo "cohort_manifest=$manifest" >> "$GITHUB_OUTPUT"
            if [ "$requested" = "act_registry_intake" ]; then
              echo "is_registry_intake=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_registry_intake=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$requested" = "act_staging_effect" ]; then
              test -n "$REQUESTED_STAGING_MANIFEST"
              echo "is_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=$REQUESTED_STAGING_MANIFEST" >> "$GITHUB_OUTPUT"
            else
              echo "is_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=" >> "$GITHUB_OUTPUT"
            fi
          else
            test "$requested" != "act_registry_intake" && test "$requested" != "act_qualified_cohort" && test "$requested" != "act_staging_effect"
            echo "is_act_proof=false" >> "$GITHUB_OUTPUT"
            echo "is_registry_intake=false" >> "$GITHUB_OUTPUT"
            if [ "$requested" = "github_app_staging_effect" ]; then
              test -n "$manifest"
              test -n "$REQUESTED_STAGING_MANIFEST"
              echo "cohort_manifest=$manifest" >> "$GITHUB_OUTPUT"
              echo "is_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=true" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=$REQUESTED_STAGING_MANIFEST" >> "$GITHUB_OUTPUT"
            else
              test -z "$requested"
              echo "cohort_manifest=" >> "$GITHUB_OUTPUT"
              echo "is_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "is_hosted_staging_effect=false" >> "$GITHUB_OUTPUT"
              echo "staging_target_manifest=" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          clean: ${{ steps.runtime-mode.outputs.is_act_proof != 'true' }}
      - uses: actions/download-artifact@v4
        with:
          name: registry-revision-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - id: matrix
        name: Emit matrix from data/products.json
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository || github.event.client_payload.repository }}
          COHORT_MANIFEST: ${{ steps.runtime-mode.outputs.cohort_manifest }}
          IS_ACT_PROOF: ${{ steps.runtime-mode.outputs.is_act_proof }}
          IS_REGISTRY_INTAKE: ${{ steps.runtime-mode.outputs.is_registry_intake }}
          IS_STAGING_EFFECT: ${{ steps.runtime-mode.outputs.is_staging_effect }}
        run: |
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            test -f "runs/act-registry-intake/shared-workspace-${GITHUB_RUN_ID}.marker" || {
              echo "::error::ACT registry-intake proof requires a shared bound workspace; invoke act with --bind"
              exit 2
            }
          elif [ "$IS_ACT_PROOF" = "true" ]; then
            test -f "runs/act-poc/shared-workspace-${GITHUB_RUN_ID}.marker" || {
              echo "::error::act proof requires a shared bound workspace; invoke act with --bind"
              exit 2
            }
          fi
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            if [ -n "$REQUESTED_REPOSITORY" ]; then
              matrix=$(readme-agent runtime-matrix --only "$REQUESTED_REPOSITORY" | jq -c .)
            else
              matrix=$(readme-agent runtime-matrix | jq -c .)
            fi
          elif [ "$IS_ACT_PROOF" = "true" ] || [ "$IS_STAGING_EFFECT" = "true" ]; then
            matrix=$(readme-agent qualified-cohort-matrix --manifest "$COHORT_MANIFEST" | jq -c .)
            if [ -n "$REQUESTED_REPOSITORY" ]; then
              matrix=$(jq -cn \
                --argjson source "$matrix" \
                --arg repository "$REQUESTED_REPOSITORY" \
                '{include: [$source.include[] | select(.repo == $repository)]}')
              test "$(jq '.include | length' <<<"$matrix")" -eq 1 || {
                echo "::error::requested repository is not in the qualified cohort"
                exit 2
              }
            fi
          elif [ -n "$REQUESTED_REPOSITORY" ]; then
            matrix=$(readme-agent runtime-matrix --only "$REQUESTED_REPOSITORY" | jq -c .)
          else
            matrix=$(readme-agent runtime-matrix | jq -c .)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: identity
        name: Derive stable schedule window
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          window="$(date -u +%Y-%m-%d)"
          if [ -n "$SCHEDULE_EXPRESSION" ]; then
            window="$window:$SCHEDULE_EXPRESSION"
          fi
          echo "schedule_window=$window" >> "$GITHUB_OUTPUT"

  analyze:
    name: Observe ${{ matrix.repo }}
    needs: plan
    if: ${{ needs.plan.outputs.is_staging_effect != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Central-repository state refs only. Target-repository access uses
      # the separately minted read-only App installation token below.
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: readme-agent-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ needs.plan.outputs.is_act_proof != 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Bind isolated ACT state remote
        if: ${{ needs.plan.outputs.is_act_proof == 'true' }}
        run: |
          if [ "${{ needs.plan.outputs.is_registry_intake }}" = "true" ]; then
            state_root=runs/act-registry-intake
          else
            state_root=runs/act-poc
          fi
          test -f "$state_root/shared-workspace-${GITHUB_RUN_ID}.marker" || {
            echo "::error::act proof requires a shared bound workspace; invoke act with --bind"
            exit 2
          }
          echo "README_AGENT_STATE_REMOTE=$PWD/$state_root/state.git" >> "$GITHUB_ENV"
      - name: Controlled ACT matrix-isolation failure
        if: >-
          ${{
            needs.plan.outputs.is_act_proof == 'true' &&
            env.README_AGENT_ACT_FAIL_REPOSITORY == matrix.repo
          }}
        run: |
          echo "::error::controlled ACT failure for matrix-isolation proof"
          exit 86
      - name: Mint repository-scoped read-only GitHub App token
        id: target-token
        if: ${{ needs.plan.outputs.is_act_proof != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-contents: read
      - name: Run canonical fail-closed supervisor
        env:
          IS_ACT_PROOF: ${{ needs.plan.outputs.is_act_proof }}
          IS_REGISTRY_INTAKE: ${{ needs.plan.outputs.is_registry_intake }}
          COHORT_MANIFEST: ${{ needs.plan.outputs.cohort_manifest }}
          README_AGENT_PRODUCTION_AUTH: ${{ needs.plan.outputs.is_act_proof == 'true' && 'act_local' || 'github_app' }}
          README_AGENT_ACT_GITHUB_TOKEN: ${{ secrets.ACT_GITHUB_READ_TOKEN }}
          README_AGENT_GITHUB_APP_TOKEN: ${{ steps.target-token.outputs.token }}
          README_AGENT_TRIGGER_ID: ${{ github.run_id }}
          README_AGENT_DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
          README_AGENT_SCHEDULE_WINDOW: ${{ needs.plan.outputs.schedule_window }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --no-registry-heal --execution-profile act_registry_intake \
              --max-readme-poc-stage INTAKE_READY
          elif [ "$IS_ACT_PROOF" = "true" ]; then
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --no-registry-heal --execution-profile act_poc \
              --max-readme-poc-stage TRUSTED_NO_OP_PROVEN \
              --qualified-cohort-manifest "$COHORT_MANIFEST"
          else
            readme-agent supervise --repo "${{ matrix.repo }}" \
              --no-registry-heal --execution-profile github_observe
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: run-evidence-${{ matrix.owner }}__${{ matrix.name }}-${{ github.run_id }}
          path: runs/evidence/${{ github.run_id }}/${{ matrix.owner }}__${{ matrix.name }}/

  stage-proposal:
    name: Stage trusted proposal for ${{ matrix.repo }}
    needs: plan
    if: ${{ needs.plan.outputs.is_staging_effect == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # The workflow token writes only control-repository effect-ledger refs.
      # The target-repository token is minted separately below.
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ needs.plan.outputs.is_act_proof != 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Restore immutable hosted cohort candidates
        if: ${{ needs.plan.outputs.is_hosted_staging_effect == 'true' }}
        env:
          COHORT_MANIFEST: ${{ needs.plan.outputs.cohort_manifest }}
        run: |
          readme-agent restore-qualified-cohort \
            --manifest "$COHORT_MANIFEST" \
            --input-manifest plans/investigations/evidence/trp-04p-act-workflow-inputs-v1/manifest.json \
            --runtime-root runs/readme-poc \
            --state-remote runs/hosted-staging/input-state.git \
            --output runs/hosted-staging/restore.json
      - id: staging-target
        name: Resolve immutable disposable target before token minting
        env:
          SOURCE_REPOSITORY: ${{ matrix.repo }}
          STAGING_MANIFEST: ${{ needs.plan.outputs.staging_target_manifest }}
        run: |
          target=$(jq -r --arg source "$SOURCE_REPOSITORY" \
            '.targets[] | select(.source_repository == $source) | .target_repository' \
            "$STAGING_MANIFEST")
          test -n "$target" && test "$target" != "null"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "target_owner=${target%%/*}" >> "$GITHUB_OUTPUT"
          echo "target_name=${target#*/}" >> "$GITHUB_OUTPUT"
      - name: Mint target-scoped GitHub App effect token
        id: staging-token
        if: ${{ needs.plan.outputs.is_hosted_staging_effect == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.staging-target.outputs.target_owner }}
          repositories: ${{ steps.staging-target.outputs.target_name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Apply immutable trusted proposal with isolated write credential
        env:
          SOURCE_REPOSITORY: ${{ matrix.repo }}
          COHORT_MANIFEST: ${{ needs.plan.outputs.cohort_manifest }}
          STAGING_MANIFEST: ${{ needs.plan.outputs.staging_target_manifest }}
          IS_HOSTED_STAGING_EFFECT: ${{ needs.plan.outputs.is_hosted_staging_effect }}
          README_AGENT_GITHUB_APP_TOKEN: ${{ steps.staging-token.outputs.token }}
          README_AGENT_STAGING_WRITE_TOKEN: ${{ secrets.STAGING_GITHUB_WRITE_TOKEN }}
        run: |
          target="${{ steps.staging-target.outputs.target }}"
          if [ "$IS_HOSTED_STAGING_EFFECT" = "true" ]; then
            test -n "$README_AGENT_GITHUB_APP_TOKEN"
            auth_provider=github_app
            authorization_dir=plans/investigations/evidence/trp-04p-github-app-hosted-qualification-v1/authorization
          else
            test -n "$README_AGENT_STAGING_WRITE_TOKEN"
            test -f "runs/act-poc/shared-workspace-${GITHUB_RUN_ID}.marker"
            auth_provider=staging_pat
            authorization_dir=runs/staging/authorization
            export README_AGENT_STATE_REMOTE="$PWD/runs/staging/state-v3.git"
          fi
          mkdir -p runs/staging/workflow-results
          python -m readme_agent.capabilities.staging_effect \
            --source-repository "$SOURCE_REPOSITORY" \
            --target-repository "$target" \
            --cohort-manifest "$COHORT_MANIFEST" \
            --staging-manifest "$STAGING_MANIFEST" \
            --authorization-dir "$authorization_dir" \
            --auth-provider "$auth_provider" \
            --output "runs/staging/workflow-results/${GITHUB_RUN_ID}-${target//\//__}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-effect-${{ matrix.owner }}__${{ matrix.name }}-${{ github.run_id }}
          path: runs/staging/workflow-results/

  health:
    name: Portfolio health and alert
    needs: [plan, analyze, resume]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ needs.plan.outputs.is_act_proof != 'true' }}
      - uses: actions/download-artifact@v4
        with:
          name: registry-revision-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install -e . --no-deps
      - name: Bind isolated ACT state remote
        if: ${{ needs.plan.outputs.is_act_proof == 'true' }}
        run: |
          if [ "${{ needs.plan.outputs.is_registry_intake }}" = "true" ]; then
            state_root=runs/act-registry-intake
          else
            state_root=runs/act-poc
          fi
          echo "README_AGENT_STATE_REMOTE=$PWD/$state_root/state.git" >> "$GITHUB_ENV"
      - name: Aggregate durable health
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository || github.event.client_payload.repository }}
          COHORT_MANIFEST: ${{ needs.plan.outputs.cohort_manifest }}
          IS_ACT_PROOF: ${{ needs.plan.outputs.is_act_proof }}
          IS_REGISTRY_INTAKE: ${{ needs.plan.outputs.is_registry_intake }}
          IS_STAGING_EFFECT: ${{ needs.plan.outputs.is_staging_effect }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RESUME_RESULT: ${{ needs.resume.result }}
        run: |
          mkdir -p runs/workflow
          if [ "$IS_REGISTRY_INTAKE" = "true" ]; then
            if [ -n "$REQUESTED_REPOSITORY" ]; then
              readme-agent health-report --only "$REQUESTED_REPOSITORY" \
                --upstream-job-result "plan=$PLAN_RESULT" \
                --upstream-job-result "analyze=$ANALYZE_RESULT" \
                --upstream-job-result "resume=$RESUME_RESULT" \
                --output runs/workflow/health-report.json
            else
              readme-agent health-report \
                --upstream-job-result "plan=$PLAN_RESULT" \
                --upstream-job-result "analyze=$ANALYZE_RESULT" \
                --upstream-job-result "resume=$RESUME_RESULT" \
                --output runs/workflow/health-report.json
            fi
          elif [ "$IS_ACT_PROOF" = "true" ] || [ "$IS_STAGING_EFFECT" = "true" ]; then
            repositories=$(readme-agent qualified-cohort-matrix \
              --manifest "$COHORT_MANIFEST" | jq -r '[.include[].repo] | join(",")')
            readme-agent health-report \
              --only "$repositories" --output runs/workflow/health-report.json
          elif [ -n "$REQUESTED_REPOSITORY" ]; then
            readme-agent health-report \
              --only "$REQUESTED_REPOSITORY" --output runs/workflow/health-report.json
          else
            readme-agent health-report --output runs/workflow/health-report.json
          fi
      - id: health-state
        run: echo "healthy=$(jq -r .healthy runs/workflow/health-report.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-health-${{ github.run_id }}
          path: runs/workflow/health-report.json
      - name: Create or update visible health issue
        if: ${{ steps.health-state.outputs.healthy != 'true' && needs.plan.outputs.is_act_proof != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "README Agent production health is degraded"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          body="Run $RUN_URL produced an unhealthy HealthReportV1. Download the portfolio-health artifact for backlog, stale-lease, missed-window, evidence, and state-failure details."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
      - name: Record suppressed remote alert during ACT proof
        if: ${{ steps.health-state.outputs.healthy != 'true' && needs.plan.outputs.is_act_proof == 'true' }}
        run: echo "::warning::ACT health is degraded; remote issue effect was correctly suppressed"
      - id: dead-man-config
        name: Detect external dead-man configuration
        env:
          HEARTBEAT_URL: ${{ secrets.DEAD_MAN_HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send external dead-man heartbeat
        if: ${{ steps.dead-man-config.outputs.configured == 'true' && needs.plan.outputs.is_act_proof != 'true' }}
        env:
          HEARTBEAT_URL: ${{ secrets.DEAD_MAN_HEARTBEAT_URL }}
        run: curl --fail-with-body --retry 3 --max-time 30 "$HEARTBEAT_URL"
      - name: Warn when dead-man monitor is not configured
        if: ${{ steps.dead-man-config.outputs.configured != 'true' }}
        run: echo "::warning::DEAD_MAN_HEARTBEAT_URL is not configured; scheduler absence cannot be detected externally"
      - name: Fail the Actions check when portfolio health is degraded
        if: ${{ steps.health-state.outputs.healthy != 'true' }}
        run: exit 1

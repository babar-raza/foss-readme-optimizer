prompt_id: claim_disposition_check
category: verification
version: "4"
model_route: claim_disposition_check
owner: readme_agent.readme.claim_accountability_llm_disposition
runtime_consumer: readme_agent.llm.claim_disposition_prompts
output_contract: claim-disposition-verdict-v1
invalidation_scope: DETERMINISTIC_VALIDATED
dependent_artifacts:
  - review/claim-dispositions.json
system: |
  You are reconciling one sentence from a repository's original README against a freshly
  generated candidate README, because a mechanical fact-coverage check could not bind the
  original sentence to a pre-extracted verified fact. You are not authoring new content -- you
  are classifying whether this one sentence is already covered, is a genuinely new detail you can
  confirm by reading the real repository source shown to you, or carries no independent factual
  content at all.

  Classify as exactly one of:
  - redundant_with_candidate: the sentence's meaning already appears, in different words, in the
    candidate text shown to you. Quote the exact candidate text (verbatim) that carries the same
    meaning, and name the section heading it falls under.
  - verified_against_source: the sentence states a genuinely new, checkable detail not already in
    the candidate, and you can confirm it by reading one of the real repository files listed. Name
    the exact file path and quote a verbatim excerpt from that file's real content that confirms
    the claim. Never invent a file path or a quote you did not actually see.
    Special case -- a named, real, non-text fixture: if the sentence names a specific file (for
    example a sample document a code snippet opens, like "SimpleTable.one") and that exact
    filename appears in the repository file listing, this also counts as verified_against_source
    even though the file has no readable text to quote (a binary document). Name the exact listed
    path in evidence_ref and leave evidence_quote EMPTY -- do not invent a fake quote and do not
    fall back to citing a different, unrelated file just to have something to quote. The listing
    only ever shows paths that genuinely exist, so citing a listed path this way is always honest.
    Special case -- editorial paraphrase of a real API member's behavior: if the sentence
    describes, in its own words, what a specific API member does (for example "the generic
    `generate()` entry point" describing a real function's role) rather than stating a fact you
    can quote verbatim from a file, use evidence_type api_surface_member instead of
    clone_cache_path. Name the exact bare member name (e.g. "generate") in evidence_ref, copied
    verbatim from the inline code already present in the sentence -- never a name the sentence
    does not already mention, and never guess at a plausible-sounding member that is not written
    there. Leave evidence_quote EMPTY -- this confirms that a real, publicly-confirmed member
    exists and the sentence is about it, not that any particular wording is quoted from anywhere.
  - narrative_filler: the sentence is pure transitional or framing prose (e.g. "Here's how it
    works:") with no independent factual claim of its own.
  - excluded_with_reason: the sentence is deliberately excluded from the candidate for exactly
    one machine-checkable reason, which you must name in evidence_ref as exactly one of:
    * unverifiable_fixture_dependency:<path> -- the sentence's code or text references a
      repository fixture file (for example a sample document the code opens) that an isolated
      verifier cannot assume exists. Copy <path> character-for-character from the sentence
      itself; the automated check refuses a path that does not appear verbatim in the sentence
      or that actually ships with the package sources.
    * superseded_by_verified_slot:<slot_id> -- a verified candidate section fully supersedes the
      sentence. Quote at least 40 characters, copied verbatim, from that superseding candidate
      section in evidence_quote.
    * stale_version_string:<version> -- the sentence pins a version string that the candidate no
      longer mentions anywhere. Copy <version> character-for-character from the sentence itself.
    A stated reason outside these three predicates is not checkable here -- use unverifiable
    instead. Your reasoning text is recorded but never trusted on its own; only the predicate
    re-check decides.
  - unverifiable: none of the above genuinely apply. Always default to this when you are not
    certain -- an incorrect unverifiable classification only means the sentence stays
    conservatively unaccepted; an incorrect positive classification would be a real accountability
    gap. Never guess.

  Every quote you provide must be copied character-for-character from text you were actually
  shown. A classification whose quote cannot be found verbatim in the cited location will be
  discarded by an automated check regardless of your reasoning.
user_template: |
  Original README sentence to classify:

  $claim_text

  Generated candidate README (the full document):

  $candidate_text

  Repository files available to read (only these paths are real; do not cite any other path):

  $repository_file_listing
input_schema:
  claim_text: string
  candidate_text: string
  repository_file_listing: string
examples: []
notes: "New 2026-08-18: the bounded LLM-verification alternative acceptance path for claim
  accountability, alongside (never instead of) the existing mechanical whole-claim fact-variant
  coverage check (source_claim_fact_binding.py::_covered_by_fact_variants). Mirrors aspose.org's
  own proven content-dispositions.json reconciliation model (classification + evidence_ref +
  verbatim-quote corroboration), adapted to this project's 'LLM must not invent facts' standing
  constraint: every verdict is deterministically re-corroborated against the exact text/file shown
  before it can affect claim accountability (verification/claim_disposition.py), both at
  composition time and again, independently, by the validator -- never trusted from the model's
  own say-so alone. Version 2 (2026-08-18, E5 slice 1): adds the excluded_with_reason
  classification -- aspose.org's excluded + excluded_reason analogue -- accepted only when the
  cited evidence_ref names one of three machine-checkable predicates
  (unverifiable_fixture_dependency / superseded_by_verified_slot / stale_version_string) that
  deterministic code re-verifies against the claim text, candidate, and repository clone.
  Version 3 (2026-08-19): direct investigation of aspose.org's live content-example-
  dispositions.json for a repository this project was blocked on (note-python's
  Document('SimpleTable.one') Quick Start claim) found aspose.org verifies such claims as
  verified_against_source with evidence_type clone_cache_path and NO evidence_quote -- their
  verification is existence-only for named binary fixtures, never a text-quote match, because a
  quote inside a binary document is not a meaningful check. This project's file listing
  previously hid such fixtures entirely (a source-extension allowlist excluded them), which is
  the real reason the model never cited them and instead reached for plausible-but-inexact
  substitute citations. repository_file_listing() now lists every real file (minus VCS/cache/
  build noise) and the verified_against_source path documents the existence-only case
  explicitly.
  Version 4 (2026-08-19): a direct second lesson from the same aspose.org investigation,
  continued straight from version 3 (mission-recovery-2026-08-18/aspose-org-lesson-2-api-
  surface-evidence.md). Investigating the exact claim still blocking barcode-python
  (source:claim:2626:54e67ed0a47ae8af -- the Key-Capabilities bullet describing the generic
  `generate()` entry point) found aspose.org's content-dispositions.json unit_id u0017 classifies
  it verified_against_source with evidence_type clone_cache_path, evidence_ref
  'src/aspose_barcode_foss/api.py', and an evidence_note (no evidence_quote field at all)
  confirming the real, public `generate(symbology, data, *, encode=None, render=None)` signature.
  This is a third, distinct verification shape: not a literal-text quote, not a named-fixture's
  existence, but a claim that is EDITORIAL PARAPHRASE of a real API member's real, extracted
  behavior. This project already extracts exactly the structured fact aspose.org's evidence_note
  encodes (`facts/aspose_detectors.py::ApiSurfaceMemberV1`'s `name`/`signature` fields per public
  member) -- the gap was that claim_disposition_check's corroboration path had no way to consult
  it. Adds evidence_type api_surface_member for verified_against_source: evidence_ref names the
  bare member name copied verbatim from inline code already in the claim text (the model cannot
  invent a name, only confirm one the claim already names -- reusing the same bare-name
  extraction verified_template_api_method_index.py already proves against source READMEs), that
  name must match a real public member of the currently-extracted API surface, and
  evidence_quote must be empty (a shape confirmation, never a text quote, same discipline as
  version 3's existence-only fixture case). Deliberately NOT free-form 'does this paraphrase
  accurately describe the signature' -- that would trust the model's semantic judgment, the
  exact failure mode this investigation has been fighting throughout; the safe, minimal claim
  stays narrower: 'this claim is about a real, publicly-confirmed member.'"

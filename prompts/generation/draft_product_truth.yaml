prompt_id: draft_product_truth
category: generation
version: "12"
model_route: draft_product_truth
owner: readme_agent.capabilities.draft_product_truth
runtime_consumer: readme_agent.llm.generation_prompts
output_contract: DraftProductTruthV1
invalidation_scope: FACTS_COLLECTING
dependent_artifacts:
  - facts/proposed-product-truth.json
  - facts/product-facts.json
system: |
  You are drafting the product_truth section of a repository's policy profile: the subjective positioning (audience, problems_solved) and repository-verifiable technical assertions (capabilities, formats, limitations, minimal_example) that describe what this real open-source repository actually does. This draft is NOT trusted on its own -- every claim you make is checked afterward by a real deterministic gate before it can be used anywhere, and any claim that fails the gate is discarded, never silently kept. Your only job is to draft claims that will actually PASS those gates, by grounding every claim in exactly what you were given, never in what you assume, infer beyond the evidence, or recall from training about similar products.

  You are given two things: (1) objective facts already mechanically established for this repository (a JSON list of facts, each with a stable fact_id), and (2) bounded repository context: the README, the package manifest, and a size-bounded selection of real source/doc file excerpts, each preceded by a line naming its exact repository-relative path.

  Hard rules -- a violation of any of these is mechanically detected and blocks the whole field, wasting a repair attempt:
  - Keep the result bounded: exactly 1 audience claim; 1-4 problems_solved claims; 3-8 capabilities; 1-8 formats; and 0-4 limitations. Use at most 4 evidence paths or required symbols per technical claim. The minimal example must be at most 6 short statements and 600 characters, importing at most 3 product symbols. Never reproduce a whole source file or enumerate every class, method, or format in the repository.
  - Every audience claim and every problems_solved claim MUST carry supporting_fact_ids: one or more fact_id values copied EXACTLY, character for character, from the objective facts JSON you were given. Never invent a fact_id, never cite one that is not present in that JSON.
  - For audience, use exactly this conservative complete sentence: "Developers using <literal platform or ecosystem value from an objective fact>." Cite only the identity/platform fact that contains that literal value. Do not append a capability, purpose, or "for ..." phrase: imperative capability text such as "Create and manipulate..." becomes ungrammatical when appended to an audience label. The tool's minimal_example.language enum is NOT audience evidence: for example, when the objective platform fact says `net`, write `net`, never `dotnet`. "Developers" and "using" are the only audience-specific grammatical words the gate permits without literal citation support.
  - For problems_solved, copy one or more complete capability or format values VERBATIM as separate claims. Add no lead-in, synonym, marketing language, or inferred outcome.
  - Every other significant word in audience/problems_solved must literally occur in at least one cited fact's value. Do not merely paraphrase or stay semantically close: literal lexical coverage is required. Never add generic filler adjectives ("powerful", "robust", "enterprise-grade", "seamless") or positioning ("free alternative", "no-cost", "without rewriting") unless those exact words occur in an accepted cited fact.
  - Every capabilities claim, every formats claim, every limitations claim, and the minimal example MUST carry at least one required_symbols entry in addition to evidence_paths. Each symbol must be a literal, contiguous, copy-pasted substring of one of those same files' shown content. Never invent a path or anchor, never guess a plausible-looking symbol, and never cite a file you were not shown. This means: never write a fully-qualified dotted reference like "ClassName.CONSTANT" or "ClassName.method" unless that EXACT dotted text appears verbatim in the file -- if the file shows `public static final String XLSX = "xlsx";` inside `class SaveFormat`, the correct required_symbol is the bare `XLSX` (or another exact phrase such as `public static final String XLSX`), never `SaveFormat.XLSX`. If no exact evidence anchor is present, draft a narrower claim that has one; a file path by itself proves only that the file exists, not the claim.
  - A limitation is a constraint, exclusion, incomplete area, or requirement -- never merely the name of a feature or API. Every limitations claim must cite at least one exact required_symbols anchor that itself explicitly expresses the constraint (for example text containing "not supported", "only", "limited", "requires", "incomplete", "out of scope", `UnsupportedOperationException`, or `NotSupportedException`). A positive symbol such as `Render`, `License`, or `BooleanOperator` proves that an API exists and cannot prove that it is a limitation. If the supplied context contains no explicit constraint evidence, return an empty limitations array.
  - minimal_example.language MUST equal the repository ecosystem value enforced by the submission tool ("java", "dotnet", "python", "typescript", "go", "cpp", or "rust"). Prefer a working usage already present in repository tests, samples, or documentation over synthesizing one from unrelated symbol declarations. Preserve the imports or using directives that the working usage requires, and cite the file that demonstrates the API rather than a file that merely contains the same token incidentally. minimal_example.code MUST be a self-contained compiling snippet in that language using only public classes/methods/symbols that actually appear in the repository context you were given, cited via minimal_example.evidence_paths/required_symbols the same way as the other fields. For Python, never access an attribute whose name begins with `_`; a compiling private attribute is still unsuitable README guidance. Use only straight ASCII quote characters in code, never typographic/smart quotation marks. Declare every identifier before use. Use at most 6 executable statements. Do not copy a CLI/converter program: no command-line arguments, Console/print status messages, try/catch, namespace, or class scaffold unless compilation in that ecosystem requires the class. For dotnet, every unqualified product type must be brought into scope by copying its namespace import from a working repository usage or its declaration; for example, `Box` declared under `namespace Aspose.ThreeD.Entities` requires `using Aspose.ThreeD.Entities;` in addition to `using Aspose.ThreeD;`. Prefer top-level statements and obtain a path with `System.IO.Path.GetTempFileName()` so the snippet needs no fragile nested string literal; declare the product object, declare `var output = System.IO.Path.GetTempFileName();`, then call the cited save method with `output`. Never use undeclared placeholders such as `input`, `output`, `file`, or `args`. Keep it minimal: create or load an object, perform one representative operation, save or output the result -- not an exhaustive feature tour.
  - The submission tool restricts supporting_fact_ids and evidence_paths to identifiers actually supplied in this turn. Select from those values; never rewrite a path. required_symbols is mandatory for every technical claim and example; copy exact anchors from the supplied context.
  - If the repository context does not give you enough evidence to support a field, draft FEWER claims for that field rather than inventing unsupported ones -- an honestly incomplete field that passes the gate is far better than a fabricated one that gets blocked. Capabilities, formats, audience, problems_solved, and minimal_example are required; limitations is explicitly optional and must be empty when no explicit constraint evidence exists.

  If you are given repair hints (specific reasons a prior draft attempt failed the deterministic gate for one or more fields), treat them as authoritative instructions for exactly what to fix in this new attempt -- do not repeat the same unsupported citation or invented path, and leave fields that were not flagged as you would have drafted them anyway.

  Respond with ONLY a raw JSON object, no markdown fence and no other text, matching exactly this shape:
  {"audience": [{"claim_id": "<short stable id>", "text": "<claim text>", "supporting_fact_ids": ["<fact_id>", ...]}, ...], "problems_solved": [{"claim_id": "<short stable id>", "text": "<claim text>", "supporting_fact_ids": ["<fact_id>", ...]}, ...], "capabilities": [{"value": "<claim text>", "evidence_paths": ["<repo-relative path>", ...], "required_symbols": ["<literal symbol>", ...]}, ...], "formats": [{"value": "<claim text>", "evidence_paths": ["<repo-relative path>", ...], "required_symbols": ["<literal symbol>", ...]}, ...], "limitations": [{"value": "<claim text>", "evidence_paths": ["<repo-relative path>", ...], "required_symbols": ["<literal symbol>", ...]}, ...], "minimal_example": {"language": "java|dotnet|python|typescript|go|cpp|rust", "class_name": "<identifier>", "code": "<full example source>", "evidence_paths": ["<repo-relative path>", ...], "required_symbols": ["<literal symbol>", ...]}}
user_template: |
  Repository: $org_repo
  Ecosystem (minimal_example.language must match this): $ecosystem

  Objective facts already established for this repository -- cite ONLY fact_id values that literally appear in this JSON for supporting_fact_ids:
  $objective_facts_json

  Repository context (README, manifest, and a bounded selection of real source/doc file excerpts, each preceded by its exact repository-relative path) -- cite ONLY paths/symbols that literally appear below for evidence_paths/required_symbols:
  $repository_context
  $repair_hints_section
  Draft product_truth now as the exact JSON shape specified in your instructions.
input_schema:
  org_repo: string
  ecosystem: string
  objective_facts_json: string
  repository_context: string
  repair_hints_section: string
examples: []
notes: "New for RPOC-030-033 (`executive-verdict-the-swirling-adleman.md` Part B.2 Phase 2 Lane F, design in Part C.5). Closes the dominant recon finding that every one of the 27 non-pilot repos fails the same validation stage for the identical reason: no product_truth exists for them. Drafts the 5 genuinely interpretive ProductFactsV2 fields (audience/problems_solved/capabilities/formats/limitations) plus minimal_example -- never the ~11 already-mechanically-derived objective fields, which are supplied as read-only grounding context instead. audience/problems_solved use the InterpretiveClaimV1 shape (`facts/interpretive_evidence.py`) so the response routes directly through `groundedness_fact_candidate()` unchanged; capabilities/formats/limitations/minimal_example reuse `registry/models.py`'s existing `EvidenceBackedProductFact`/`MinimalExamplePolicy` shapes unchanged, so a passed draft is already policy-YAML-shaped. `model_route: draft_product_truth` is registered in `env.py::JOB_MODEL_ROUTING`, live-characterized in `plans/investigations/evidence/draft-product-truth-route-characterization-2026-07-25/characterization-and-recommendation.md` against this exact prompt (not a reconstruction)."

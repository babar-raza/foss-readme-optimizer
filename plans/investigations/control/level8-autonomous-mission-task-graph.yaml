schema_version: 2
autonomous_execution_contract:
  selected_mechanism: readme-agent-supervisor
  mechanism_type: autonomous_supervision
  entry_point: readme-agent supervise
  invocation: .venv/Scripts/readme-agent supervise --mission-task-graph plans/investigations/control/level8-autonomous-mission-task-graph.yaml
  governing_state: Versioned mission state persisted by the supervisor; the committed task graph is the
    declarative source and audit record.
  task_source: plans/investigations/control/level8-autonomous-mission-task-graph.yaml
  continuation_source: dependency-ready taskcards in this graph
  continuation_consumer: readme-agent supervisor mission controller
  stop_evaluator: mission-aware supervisor task-graph evaluator
  resume_strategy: Reload the same task graph and versioned mission state, reconcile claimed work, and
    claim the highest-priority dependency-ready task.
  rejected_alternative: repository autonomous cycling mechanism
  mechanism_locked: true
mission_authority:
  mission_id: LEVEL8-CENTRAL-REPOSITORY-PRESENTATION
  mission_summary: Keep GOAL-CORE-PRESENTABLE-PORTFOLIO active until every current registry repository
    has a professional, product-specific, independently approved and no-op-proven README and GitHub-profile
    bundle, then carry those same deliverables through the ordered delivery and Level-8 gates using the
    sole production supervisor.
  governing_plan_path: plans/master.md
  current_phase: Wave 0 - truth consolidation and shippable baseline
  in_scope_outcomes:
  - 'GOAL-CORE-PRESENTABLE-PORTFOLIO: complete visitor-facing README and profile bundles for the dynamic
    registry denominator; machinery is supporting work rather than the deliverable.'
  - 'GOAL-TRUTH: verified facts, examples, acquisition, limitations, compatibility, and contextual-link
    evidence.'
  - 'GOAL-README: marker-free product-specific candidate, visual, patch, validation, approval, repair,
    and no-op proof.'
  - 'GOAL-PROFILE: description, homepage, topics, community-file findings, generated-surface observations,
    and product illustration.'
  - 'GOAL-AUTONOMY: safe, resumable, isolated, idempotent, evidence-complete execution through supervise.'
  - 'GOAL-DELIVERY: Gate B, act, staging, Gate C, and hosted GitHub App proof in order.'
  - 'GOAL-MATURITY: Level 5, heterogeneous Level 7, and independently audited Level 8.'
  - One canonical production supervisor and no alternate mutation path.
  - Restartable GitHub Actions runtime with durable lifecycle recovery.
  - Provenance-complete product facts and surface ownership.
  - Repository-specific presentation intelligence across controlled surfaces.
  - Verified proposal and authorized draft-PR effect lifecycle.
  - Controlled three-repository Java pilot.
  - Heterogeneous seven-ecosystem production portfolio.
  - Ninety-day independently reproducible Level-8 production proof.
  out_of_scope_items:
  - Automatic merge or default-branch writes.
  - Package or release publication.
  - Writes to GitHub-generated surfaces.
  - Unreviewed onboarding into write-enabled operation.
  mandatory_acceptance_criteria:
  - Every task transition recomputes the dynamic-denominator lifecycle scoreboard, first failing boundary,
    exact next task, subordinate goal, and concrete core contribution.
  - No machinery task closes unless it produces a visible deliverable, removes its evidenced first failing
    boundary, establishes an indispensable safety condition, or completes required acceptance proof.
  - Every accepted trigger is terminal or visibly retryable or blocked.
  - No unauthorized, duplicate, default-branch, package, release, or generated-surface write.
  - No false-success terminal state.
  - Every terminal run has a checksum-complete manifest.
  - Deterministic validation remains at 100 percent.
  - Agentic golden-set accuracy is at least 95 percent across the governed evaluation set.
  - Level 7 has 30 consecutive production days meeting its gates.
  - Level 8 has 90 consecutive production days meeting its gates.
  - An independent audit reproduces the evidence and awards Level 8.
  conflicts_found:
  - plans/master.md still contains the obsolete phase track and requires a fresh section-specific approval
    before structural edits.
  - Uncommitted plans/status.md, plans/roadmap.md, and plans/changelog.md are not currently listed as
    allowed plan homes by plans/GOVERNANCE.md.
  - The production supervisor owns product-repository capability tasks but has no consumer for central-repository
    implementation taskcards.
  - Requirement closure prose and current repository evidence contain semantic contradictions, including
    VER-001 and the still-live alternate mutation path.
  core_goal_id: GOAL-CORE-PRESENTABLE-PORTFOLIO
  goal_catalog:
  - goal_id: GOAL-CORE-PRESENTABLE-PORTFOLIO
    role: core
    summary: Deliver and continuously prove professional repository-specific presentation for the full
      dynamic portfolio.
    acceptance_boundary: Remains active until every mandatory mission task closes and Level 8 is independently
      awarded.
  - goal_id: GOAL-TRUTH
    role: subordinate
    summary: Establish provenance-complete product truth that safely governs every visitor-facing claim.
    acceptance_boundary: Every required fact is accepted, narrowly blocked, or explicitly omitted with
      traceable evidence.
  - goal_id: GOAL-README
    role: subordinate
    summary: Produce product-specific README candidates that preserve validated source knowledge and pass
      deterministic and independent review.
    acceptance_boundary: Every current registry repository is agent-approved and no-op-proven before human
      review.
  - goal_id: GOAL-PROFILE
    role: subordinate
    summary: Produce professional repository-profile proposals and visual assets across every governed
      presentation surface.
    acceptance_boundary: Every applicable profile surface has a truthful proposal, observation, or manual
      handoff.
  - goal_id: GOAL-AUTONOMY
    role: subordinate
    summary: Keep execution safe, restartable, isolated, idempotent, observable, and evidence-complete.
    acceptance_boundary: Every accepted task and trigger resumes or reaches a truthful terminal state
      without unauthorized effects.
  - goal_id: GOAL-DELIVERY
    role: subordinate
    summary: Carry accepted local deliverables through human review, workflow, staging, proposal, and
      hosted runtime gates in order.
    acceptance_boundary: Gate B, act, staging, Gate C, and GitHub App proof close without premature access
      requests or writes.
  - goal_id: GOAL-MATURITY
    role: subordinate
    summary: Demonstrate heterogeneous production operation and the independently reproducible Level-8
      evidence window.
    acceptance_boundary: Level 5, Level 7, and Level 8 gates are independently awarded from current evidence.
  mission_locked: true

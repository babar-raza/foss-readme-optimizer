schema_version: 3
autonomous_execution_contract:
  selected_mechanism: readme-agent-supervisor
  mechanism_type: autonomous_supervision
  entry_point: readme-agent supervise
  invocation: .venv/Scripts/readme-agent supervise --mission-task-graph plans/investigations/control/level8-autonomous-mission-task-graph.yaml
  governing_state: Versioned mission state persisted by the supervisor is the sole live claim, transition,
    and task-status authority; task status values committed in this graph are bootstrap defaults only
    and never overwrite or supersede durable state. The graph is the declarative task/dependency source
    and audit record.
  task_source: plans/investigations/control/level8-autonomous-mission-task-graph.yaml
  continuation_source: dependency-ready taskcards in this graph
  continuation_consumer: readme-agent supervisor mission controller
  stop_evaluator: mission-aware supervisor task-graph evaluator
  resume_strategy: Reload the same task graph and versioned mission state, reconcile claimed work, and
    claim the highest-priority dependency-ready task; within platform-scoped work use Python, .NET, Java,
    C++, TypeScript, Rust, then Go.
  rejected_alternative: repository autonomous cycling mechanism
  mechanism_locked: true
  multi_agent_model: adaptive_coordinator_led
  coordinator_role: sole owner of shared files, integration, durable transitions, commits, final verification,
    and aggregate evidence
  independent_verification_required: true
  serial_calibration_required: true
  minimum_parallel_speedup: 1.5
  maximum_coordination_overhead_ratio: 0.25
  max_parallel_workers_beside_coordinator: 3
  task_lane_plan_required_when_delegating: true
  task_lane_plan_path_template: runs/multi-agent/{task_id}/execution-plan.json
  task_lane_plan_protocol:
  - Calibrate new shared behavior serially and use no worker when a task has no independent, disjoint
    lane.
  - Give every active worker one bounded deliverable, exclusive non-shared allowed paths, forbidden shared
    paths, focused verification, and a lane-evidence destination before starting it.
  - Documentation/State-Sync is proposal-only under runs/multi-agent; only the coordinator applies accepted
    recommendations to AGENTS.md, plans, shared evidence, taskcards, or durable state.
  - Begin with two repository workers only after transaction isolation passes; permit a third only when
    measured end-to-end speedup remains at least 1.5x and coordination overhead remains at or below 25
    percent.
  - The coordinator serializes shared-file reconciliation, integrated tests, official checks, task transitions,
    commits, and final evidence after all active implementation lanes report.
  - Independent verification starts only after integration evidence exists, uses no implementation paths,
    and must accept before human review, approval, effect authorization, or task closure.
  - A failed or incomplete lane returns to repair or a governed resolver; it does not lower acceptance
    criteria or stop unrelated dependency-ready work.
mission_authority:
  mission_id: LEVEL8-CENTRAL-REPOSITORY-PRESENTATION
  mission_summary: Complete verified_repository_presentation through an automatically derived ordered
    stage-goal state machine. Preserve trusted_readme_transform assets only as lower-assurance reusable
    inputs. Reconcile current lifecycle freshness, complete the graph-owned Python repository-focus chain
    and dynamic Python denominator, then continue through the configured platform order, Gate A, Gate
    B/C, Level 5, and deployable Level 6. Level 7 and Level 8 remain background certification states after
    deployment and never block tangible delivery. Never promote trusted evidence into verified acceptance
    or advance a dependent on a stale closed repository deliverable.
  governing_plan_path: plans/master.md
  current_phase: Derived exclusively from durable mission status after lifecycle-freshness reconciliation;
    this declarative graph does not store a mutable current-task cursor.
  in_scope_outcomes:
  - 'MISSION OUTCOME: verified_repository_presentation is the immutable closure standard, not a universal
    active runtime goal. The executable delivery path is V0, C0, V1, V2, V3, L5, and L6. L7/L8 are background
    certification states after deployment.'
  - 'TRUSTED REUSE, NOT TRUSTED EXECUTION: retain README_INHERITED extraction, LLM composition, review,
    transport, staging, cache, retry, lease, and anti-stall assets as evidence and reusable machinery.
    Remaining TP/T0R/T1/T2/T3 goals are non-executable and cannot regain primary-goal authority unless
    a future evidence-backed plan amendment explicitly reactivates them.'
  - 'COMMON DISCOVERY STAGE: after assurance separation, enumerate every authorized source at all visible
    access levels, disposition every observation, admit active products disabled/read-only, complete intake,
    and bind one source-complete RegistryRevisionV1 before verified Gate-A portfolio fan-out.'
  - 'VERIFIED STAGES: V1 establishes repository facts, V2 completes full-registry Gate A, and V3 records
    Gate-B acceptance plus verified Java proposal proof.'
  - 'MATURITY STAGES: L5 proves complete presentation surfaces on the Java pilot and L6 proves deployable
    autonomous portfolio operation. L7 and L8 are non-blocking background certifications earned after
    deployment from 30-day and 90-day evidence windows.'
  - 'DELIVERY-FIRST SHORT-TERM HORIZON: mission evaluate first reconciles closed-task freshness; mission
    status then supplies exactly one TaskExecutionFocusV1 and repository scope. Complete that repository
    through current facts, composition, validation, independent review, unchanged no-op, promotion, and
    reconstruction before advancing. One repository is partial progress; the complete dynamic Python denominator
    is the first platform POC.'
  - 'PLATFORM EXECUTION PRIORITY: load data/platform_priorities.json and use Python, .NET, Java, C++,
    TypeScript, Rust, Go whenever otherwise dependency-ready platform work, representatives, repairs,
    cohorts, or rollout items compete; preserve the denominator, valid caches, and active claims.'
  - 'MEDIUM-TERM HORIZON: qualify Python completely and prove its reusable workflow, disposable staging,
    and hosted GitHub App transport first. After repository-transaction isolation is proven, qualify .NET
    locally in a disjoint concurrent lane; then promote .NET through the same transport before Java, C++,
    TypeScript, Rust, and Go. Product effects remain separately human-reviewed and authorized.'
  - 'DELIVERY-FIRST VERTICAL-SLICE MILESTONES: pin the template-component versions per transaction; finish
    the dynamic all-Python milestone; prove Python workflow/staging/App transport; qualify the complete
    .NET cohort concurrently when isolation permits; promote .NET through the same transport; then continue
    Java and lower-priority platforms without omitting any Gate-A task or repository.'
  - 'LONG-TERM HORIZON: deploy with Level-8-grade controls, then accumulate Level-7 and Level-8 evidence
    in the background without blocking usable output or subsequent repository delivery.'
  - 'CAMPAIGN DELIVERY: unresolved taskcards remain distinct dependency and acceptance boundaries. Work
    executes through plan freeze, shared acceleration, first Python slice, Python portfolio, post-Python
    cross-platform slices, Gate A, and Gate B/later campaigns rather than one full-test and evidence cycle
    per task.'
  - 'ADAPTIVE MULTI-AGENT DELIVERY: one coordinator owns shared governance/state, integration, task transitions,
    commits, and aggregate evidence. Calibrate and repair shared machinery serially. After isolation proof,
    start with two disjoint repository workers and permit a third only while measured speedup is at least
    1.5x and coordination overhead is at most 25 percent. Independent verification never authors the work
    it accepts.'
  - One canonical production supervisor and no alternate mutation path.
  - Restartable GitHub Actions runtime with durable lifecycle recovery.
  - Provenance-complete product facts and surface ownership.
  - Repository-specific presentation intelligence across controlled surfaces.
  - Verified proposal and authorized draft-PR effect lifecycle.
  - Controlled three-repository Java pilot.
  - Heterogeneous seven-ecosystem production portfolio.
  - Ninety-day independently reproducible Level-8 production proof.
  out_of_scope_items:
  - Automatic merge or default-branch writes.
  - Package or release publication.
  - Writes to GitHub-generated surfaces.
  - Unreviewed onboarding into write-enabled operation.
  mandatory_acceptance_criteria:
  - Content assurance is explicit in facts, candidates, reviews, lifecycle, caches, manifests, proposals,
    and effects; trusted_inherited never satisfies repository_verified acceptance.
  - Exactly one primary stage goal is derived from the earliest incomplete gate, persisted atomically,
    advanced only by current evidence, and reactivated automatically after regression, invalidation, or
    denominator growth. Zero or more concurrent goals are derived only for dependency-ready read-only
    or repository-local-write work with disjoint leases, assurance isolation, proven transaction isolation,
    and capacity-policy admission; only the primary owns stop/effect authority.
  - Historical trusted facts, candidates, verdicts, no-op evidence, proposals, and PRs remain assurance-labelled
    and cannot satisfy or block verified facts, Gate A/B/C, or maturity; no trusted goal is executable
    or reserves capacity.
  - Every task transition recomputes the dynamic-denominator lifecycle scoreboard, first failing boundary,
    exact next task, derived stage goal, and concrete contribution.
  - Every selected task remains inside its functional goal's short, medium, long, or cross-cutting horizon;
    a timebox breach records the first failing boundary and smallest permanent repair and never authorizes
    another plan, unrelated abstraction, reduced acceptance, or report-only closure.
  - Campaign batching changes scheduling cost only; every task keeps separately inspectable focused proof,
    result mapping, and transition evidence, and only CLOSED satisfies a dependency.
  - Verification uses continuous touched-seam Ruff and focused tests, impact-mapped integration/safety/no-op
    proof at coherent slices, one pending current-HEAD complete gate before the first slice, and the complete
    official suite again only at Python-platform and Gate-A local closure plus later delivery or maturity
    gates that claim its scope.
  - Verification latency is measured before optimization. Runtime-only reruns may reuse a complete-suite
    receipt only under identical commit, lock, runtime, test-inventory, and gate hashes. Bounded xdist
    or CI sharding is accepted only when repeated serial/parallel inventories and outcomes match and shared-state
    tests remain isolated or serial.
  - All-code-then-test-later execution is prohibited; expensive aggregate verification is deferred to
    the declared campaign boundary, never omitted, while the first focused or safety failure is repaired
    before dependent implementation continues.
  - Failed attempts remain redacted runtime diagnostics and one checksum-complete closure package may
    prove several adjacent tasks only when it contains per-task and per-requirement acceptance mappings.
  - Deterministic gates run before paid composition or review; unchanged work is reused only under a complete
    dependency fingerprint, and shared failures are repaired once at their earliest common owner.
  - Content qualification remains coordinated by one supervisor. After native transaction, cache, sibling-isolation,
    cancellation, lifecycle, review, no-op, promotion, and serialized-aggregation proof passes, the supervisor
    may use two and then at most three isolated repository lanes. Python retains the primary goal until
    its complete platform proof closes; a disjoint .NET local-qualification lane may run concurrently
    after isolation is proven, but it has no stop, transition, aggregate-state, or effect authority. Python
    transport is proven before .NET transport, and Java follows .NET. Bounded workers use coordinator-issued
    disjoint path leases; shared files, integration, commits, task state, final verification, and final
    evidence remain coordinator-only.
  - Platform-scoped selection and cohort manifests preserve Python, .NET, Java, C++, TypeScript, Rust,
    Go order after dependency, live-claim, safety, and isolation constraints; a narrow external block
    may be bypassed temporarily but remains visible and regains priority immediately when cleared.
  - Shared family/ecosystem evidence is content-addressed and repository-bound before use; every repository
    still verifies its own coordinates, APIs, examples, limitations, license, workflows, and inherited
    README claims.
  - No machinery task closes unless it produces a visible deliverable, removes its evidenced first failing
    boundary, establishes an indispensable safety condition, or completes required acceptance proof.
  - Every accepted trigger is terminal or visibly retryable or blocked.
  - No unauthorized, duplicate, default-branch, package, release, or generated-surface write.
  - No false-success terminal state.
  - Every terminal run has a checksum-complete manifest.
  - Deterministic validation remains at 100 percent.
  - Agentic golden-set accuracy is at least 95 percent across the governed evaluation set.
  - Level 7 has 30 consecutive production days meeting its gates.
  - Level 8 has 90 consecutive production days meeting its gates.
  - An independent audit reproduces the evidence and awards Level 8.
  - delivery_complete means every executable stage through deployable Level 6 is CLOSED; it never claims
    Level 7, Level 8, or full mission closure.
  - certification_complete means the Level-7 and Level-8 background observations and independent audits
    are CLOSED; mission_complete requires both delivery_complete and certification_complete.
  conflicts_found: []
  stage_goal_catalog:
  - goal_id: GOAL-P0-PLAN-FREEZE
    order: 0
    summary: Reconcile and freeze the authoritative plan, graph, migration, status, and campaign dependencies.
    acceptance_boundary: The contradiction matrix, graph/state migration, current status, validations,
      coherent plan commit, sealed PlanFreezeV1, and immutable PipelineContractSnapshotV1 are independently
      accepted before product execution.
    max_concurrent_verified_lanes: 0
  - goal_id: GOAL-V0A-FIRST-VERIFIED-README
    order: 5
    summary: Finish the current Aspose.3D FOSS for Python FACTS_READY slice through one complete verified
      lifecycle before portfolio fan-out.
    acceptance_boundary: One current Aspose.3D Python README is independently approved, unchanged-no-op-proven,
      promoted, and independently reconstructed under one frozen contract. This is one verified README,
      not a platform POC.
    max_concurrent_verified_lanes: 1
  - goal_id: GOAL-T0-TRUSTED-QUALIFICATION
    order: 10
    execution_required: false
    summary: Separate trusted and verified assurance, then establish an initial real terminal trusted
      cohort.
    acceptance_boundary: Assurance isolation is proven and at least one current real repository is trusted
      approved and no-op-proven.
    reserved_trusted_lanes: 0
  - goal_id: GOAL-V0-VERIFIED-PYTHON-POC
    order: 11
    summary: After the first current verified README, prove Note, Page, PDF, and every remaining Python
      repository under the frozen lifecycle before any post-Python cross-platform slice.
    acceptance_boundary: Every runtime-loaded Python repository is repository-verified, independently
      approved, and unchanged-no-op-proven under the accepted reusable presentation contract.
    max_concurrent_verified_lanes: 3
  - goal_id: GOAL-TP-TRUSTED-COHORT-POC
    order: 12
    execution_required: false
    summary: Present the current qualified trusted cohort through the intended production delivery path.
    acceptance_boundary: The frozen cohort passes act, staging, hosted App, authorization, and disclosed
      draft-PR proof without changing a default branch.
    product_effects_allowed: false
    reserved_trusted_lanes: 0
    max_concurrent_verified_lanes: 1
  - goal_id: GOAL-T0R-TRUSTED-ADVERSARIAL-QUALIFICATION
    order: 13
    execution_required: false
    summary: Resume and complete the broader adversarial trusted canary matrix after the cohort POC.
    acceptance_boundary: Python, .NET, ordinary Java, injected or malformed, and largest-current README
      canaries are approved and no-op-proven under one frozen contract.
    reserved_trusted_lanes: 0
  - goal_id: GOAL-V0B-POST-PYTHON-SLICES
    order: 14
    summary: Qualify .NET locally beside the Python primary when isolation permits, then prove Python
      and .NET production transport in platform order before the Java slice.
    acceptance_boundary: Python and .NET are independently approved, fresh-transaction-no-op-proven, and
      reproducible through workflow, staging, and hosted App transport without an unauthorized product
      effect; the following Java slice remains zero-effect and reconstructable.
    concurrent_when_earlier_primary: true
    max_concurrent_verified_lanes: 2
  - goal_id: GOAL-C0-AUTHORIZED-PORTFOLIO
    order: 15
    summary: Discover and reconcile every repository visible from every explicitly authorized source.
    acceptance_boundary: One complete current registry revision has zero unexplained observations or pending
      intake.
    concurrent_when_earlier_primary: true
  - goal_id: GOAL-T1-TRUSTED-PORTFOLIO
    order: 20
    execution_required: false
    summary: Produce an independently approved trusted README transformation for the complete current
      portfolio.
    acceptance_boundary: Every registry entry has a trusted approved bundle and unchanged no-op proof.
    reserved_trusted_lanes: 0
    max_concurrent_verified_lanes: 1
  - goal_id: GOAL-T2-WORKFLOW-STAGING
    order: 30
    execution_required: false
    summary: Prove the canonical trusted runtime under the reusable workflow and disposable GitHub staging.
    acceptance_boundary: Act and staging recovery, deduplication, and effect matrices pass without default-branch
      writes.
    reserved_trusted_lanes: 0
    max_concurrent_verified_lanes: 1
  - goal_id: GOAL-T3-HOSTED-TRUSTED-DELIVERY
    order: 40
    execution_required: false
    summary: Qualify hosted GitHub App operation and deliver disclosed trusted draft pull requests.
    acceptance_boundary: Hosted staging is proven and exactly one authorized trusted draft PR exists per
      repository.
    product_effects_allowed: false
    reserved_trusted_lanes: 0
    max_concurrent_verified_lanes: 1
  - goal_id: GOAL-V1-VERIFIED-TRUTH
    order: 50
    summary: Establish every selected product claim from repository, package, test, or approved policy
      evidence.
    acceptance_boundary: Required verified facts are accepted or narrowly and visibly blocked for every
      repository.
    concurrent_when_earlier_primary: true
    max_concurrent_verified_lanes: 4
  - goal_id: GOAL-V2-VERIFIED-GATE-A
    order: 60
    summary: Produce independently approved repository-verified README bundles for the complete portfolio.
    acceptance_boundary: Every registry entry is repository-verified, agent-approved, and no-op-proven.
    concurrent_when_earlier_primary: true
    max_concurrent_verified_lanes: 4
  - goal_id: GOAL-V3-HUMAN-AND-JAVA-PROOF
    order: 70
    summary: Record Gate-B acceptance and prove verified Java proposals through qualified delivery machinery.
    acceptance_boundary: Human acceptance is complete and the governed verified Java proposal set passes
      Gate C.
    product_effects_allowed: true
  - goal_id: GOAL-L5-PRESENTATION-PILOT
    order: 80
    summary: Complete every governed presentation surface and the controlled three-Java production pilot.
    acceptance_boundary: An independent audit reproduces the controlled pilot and awards Level 5.
    product_effects_allowed: true
  - goal_id: GOAL-L6-AUTONOMOUS-PORTFOLIO
    order: 90
    summary: Operate every active portfolio repository autonomously in observe or proposal mode.
    acceptance_boundary: Humans are limited to governed review, authorization, facts, and manual UI boundaries.
    product_effects_allowed: true
  - goal_id: GOAL-L7-HETEROGENEOUS-30D
    order: 100
    summary: Prove a complete lifecycle per supported ecosystem and thirty clean production days.
    acceptance_boundary: The heterogeneous portfolio and uninterrupted 30-day control series pass independent
      audit.
    execution_required: false
    product_effects_allowed: false
  - goal_id: GOAL-L8-SELF-MAINTAINING-90D
    order: 110
    summary: Sustain self-maintaining portfolio operation through the complete ninety-day evidence window.
    acceptance_boundary: The 90-day control series is reproducible and an independent audit awards Level
      8.
    execution_required: false
    product_effects_allowed: false
  mission_locked: true
verified_baseline:
  schema: PlanFreezeReferenceV1
  plan_freeze_path: plans/investigations/evidence/final-throughput-correction-v1/plan-freeze-v1.json
  acceptance_receipt_path: plans/investigations/evidence/final-throughput-correction-v1/freeze-acceptance-receipt-v1.json
  interpretation: The sealed PlanFreezeV1 binds committed plan, governance, graph, schema, registry, and
    platform-priority bytes; mutable live HEAD and dirty-tree observations remain runtime evidence and
    are not embedded in this static graph.
  resolved_conflicts:
  - finding: Historical master-plan approval gating contradicted current autonomous maintenance.
    resolution: Superseded by GOV-023 and GOVERNANCE.md rule 12; evidence and traceability remain mandatory.
  - finding: Generated roadmap, status, and changelog paths were not recognized as derived plan views.
    resolution: Current governance explicitly classifies and validates those derived views.
  - finding: The production supervisor lacked a consumer for central-repository implementation taskcards.
    resolution: The durable mission task graph, claim lease, transition, and status consumer now own those
      tasks.
  - finding: VER-001 and an alternate mutation path contradicted canonical-runtime closure.
    resolution: Current requirement evidence records VER-001 implemented and the alternate path retired.
campaign_catalog:
- campaign_id: CAMP-PLAN-FREEZE
  order: 0
  summary: Reconcile authority, graph, durable state, status, validation, and frozen dependencies.
  acceptance_boundary: Every contradiction and migration is independently accepted before product work.
  full_suite_policy: Plan, governance, traceability, focused tests, and actionlint only; no full pytest.
- campaign_id: CAMP-SHARED-ACCELERATION
  order: 10
  summary: Qualify shared cache, extraction, review-risk, immutable-revision, and lane-isolation seams.
  acceptance_boundary: Shared mechanisms are frozen and proven without producing a false portfolio result.
  full_suite_policy: Focused and impacted safety, cache, cancellation, routing, and isolation tests only.
- campaign_id: CAMP-FIRST-PYTHON-SLICE
  order: 20
  summary: Complete the current Aspose.3D Python FACTS_READY slice through promotion and independent reconstruction.
  acceptance_boundary: The first current verified README is independently approved, no-op-proven, promoted,
    and reconstructable under one frozen contract.
  full_suite_policy: First run the pending optimized complete non-live suite on current committed HEAD;
    then use focused and impacted checks for the slice.
- campaign_id: CAMP-PYTHON-PORTFOLIO
  order: 30
  summary: Complete Note, Page, PDF, then every remaining runtime-loaded Python repository.
  acceptance_boundary: The dynamic Python denominator is independently approved and no-op-proven.
  full_suite_policy: Focused and impacted tests during execution; run the optimized complete non-live
    suite once at Python-platform closure.
- campaign_id: CAMP-THREE-SLICES
  order: 40
  summary: Legacy campaign ID for current post-Python .NET and Java verified vertical slices.
  acceptance_boundary: Both current cross-platform slices are independently approved and no-op-proven
    without invalidating accepted Python evidence.
  full_suite_policy: Focused and impacted cross-platform checks; no additional complete-suite run.
- campaign_id: CAMP-GATE-A-PORTFOLIO
  order: 50
  summary: Complete the remaining verified portfolio and heterogeneous qualification.
  acceptance_boundary: Every admitted repository satisfies dynamic verified Gate A with reconstructable
    evidence.
  full_suite_policy: Run the optimized complete non-live suite once at Gate-A closure.
- campaign_id: CAMP-GATE-B-AND-LATER
  order: 60
  summary: Execute Gate B, Gate C, hosted operation, presentation surfaces, and Levels 5 through 8.
  acceptance_boundary: Each governed later gate closes in dependency order with its required independent
    proof.
  full_suite_policy: Run a full suite only for a declared later gate with repository-wide acceptance scope.
taskcards:
- task_id: L8-AGILE-AUTHORITY-RESET
  mission_id: LEVEL8-CENTRAL-REPOSITORY-PRESENTATION
  parent_task_id: null
  title: Install the compact agile delivery control before product execution
  source_audit_finding: The prior authority, acceptance, invalidation, evidence, delegation, and maturity
    design created broad rework and let long-horizon machinery outrank visible README delivery.
  audit_classification: final_outcome_blocker
  priority: P0
  lane: agile-authority-reset
  owner: readme-agent-supervisor
  status: TODO
  objective: Perform one lossless bounded migration to component-versioned presentation, staged acceptance,
    just-in-time infrastructure, compact query-scoped authority, risk-based evidence, adaptive delegation,
    background certification, and evidence-backed challenge/replanning before any README resumes.
  why_it_matters: Without this reset, a small future presentation change can again invalidate unrelated
    work or allow governance and infrastructure churn to consume the visible-delivery critical path.
  allowed_paths:
  - AGENTS.md
  - plans/
  - scripts/governance/
  - src/readme_agent/state/
  - src/readme_agent/supervisor/
  - tests/unit/test_mission_control.py
  - tests/unit/test_validate_plan_structure.py
  - tests/unit/test_stage_dependency_manifest.py
  - tests/unit/test_local_poc_cache.py
  - tests/unit/test_readme_poc_lifecycle.py
  - tests/unit/test_readme_poc_acceptance_axes.py
  - tests/unit/test_agile_execution_controls.py
  - tests/unit/test_run_full_pytest.py
  - tests/unit/test_portfolio.py
  - logs/
  - src/readme_agent/cli.py
  - src/readme_agent/capabilities/effect_ledger.py
  - src/readme_agent/capabilities/open_presentation_pr.py
  - src/readme_agent/state/schema.py
  - tests/unit/test_effect_ledger.py
  - tests/unit/test_open_presentation_pr.py
  forbidden_paths:
  - runs/readme-poc/
  - production target repository remotes
  - target default branches
  - presentation rendering or ecosystem implementation
  dependencies: []
  expected_outputs:
  - Compact master and agent instructions with idea.md preserved as human product authority
  - Typed lossless requirement catalog plus current active slice
  - At most fifteen executable near-term graph tasks and five ready tasks, with deferred work traceable
  - Component delta, acceptance-axis, infrastructure-admission, test-tier, delegation, certification,
    and challenge/rethink contracts
  - Before/after authority inventory and one coherent control-only commit
  acceptance_checks:
  - Every stable requirement and task identifier has a preserved or explicit deferred disposition
  - Current task context loads no more than twenty-five requirements plus declared always-on invariants
  - Narrative handovers cannot override live durable state
  - Level-7/Level-8 elapsed periods cannot become active delivery tasks
  - A non-critical template delta leaves accepted facts and unrelated sections reusable
  - No product candidate, remote write, or speculative infrastructure is produced
  verification:
  - plan structure, catalog/index, graph/state migration, and active-slice focused tests
  - before/after stable-ID, dependency, requirement, and deferred-work coverage comparison
  - negative tests for global cosmetic invalidation, elapsed-time blocking, ceremonial delegation, and
    equivalent third attempts
  - Ruff, formatting, mypy, and git diff checks for touched control code
  negative_controls:
  - Removing a future requirement or hiding it only in Git history fails migration
  - More than fifteen executable tasks, five ready tasks, or twenty-five loaded active requirements fails
  - A cosmetic template change cannot reset a fact-valid or human-accepted numerator
  regression_checks:
  - allow-list, push blocking, redaction, authorization, factuality, no-op, and independent-review invariants
  - durable task history and claim recovery
  evidence_requirements:
  - AuthorityInventoryV1 before/after manifests and hashes
  - requirement/task/dependency migration matrix
  - focused control-test receipt and independent verification
  rollback_or_recovery: Restore the last compact-migration commit and replay only the failed control stage;
    never discard durable transition history or requirement IDs.
  failure_reroute: Two equivalent failures or fifteen minutes without narrowing require a first-principles
    mechanism or migration-boundary change; do not broaden this into product work.
  closeout_rules:
  - Compact authority and all approved agile controls are machine-enforced and independently accepted
  - L8-VPY-03B is the sole next visible-delivery task
  goal_ids:
  - GOAL-AUTONOMY
  core_contribution:
    kind: first_boundary_removal
    summary: Remove the control design that repeatedly invalidated visible output and obscured the next
      task.
  requirement_ids:
  - L8-047
  - L8-048
  - L8-049
  - L8-050
  - L8-051
  - L8-052
  - L8-053
  - L8-054
  stage_goal_id: GOAL-V0A-FIRST-VERIFIED-README
  concurrency_class: primary_only
  campaign_id: CAMP-SHARED-ACCELERATION
  execution_kind: infrastructure
  infrastructure_admission:
    trigger: current_repository_blocker
    evidence_refs:
    - The oversized control surface repeatedly invalidated visible README work and obscured the next executable
      boundary.
  verification_change_classes:
  - governance
  - mission_state
  - shared_code
  - factuality
  - safety
  evidence_promotion_boundary: shared_code
- task_id: L8-VPY-03B-FIRST-CURRENT-PYTHON-E2E
  mission_id: LEVEL8-CENTRAL-REPOSITORY-PRESENTATION
  parent_task_id: L8-VPY-03-ALL-PYTHON-VERIFIED-POC

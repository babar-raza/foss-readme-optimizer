  mission_id: LEVEL8-CENTRAL-REPOSITORY-PRESENTATION
  parent_task_id: null
  title: Bind durable execution to the immutable core deliverable and measurable subordinate goals
  source_audit_finding: The supporting plan exposed one generic stale current goal, allowing machinery
    completion to obscure whether any presentable README or profile bundle became closer to acceptance.
  audit_classification: not_attempted
  priority: P0
  lane: mission-control
  owner: readme-agent-supervisor
  status: TODO
  objective: Add validated task goal/contribution bindings and a durable lifecycle scoreboard so selection,
    transition, and closure remain tied to the presentable full-portfolio deliverable.
  why_it_matters: Autonomous execution drifts when a schema, test, report, or evidence bundle can become
    the de facto goal instead of a visitor-facing accepted result.
  allowed_paths:
  - src/readme_agent/supervisor/
  - src/readme_agent/state/
  - src/readme_agent/cli.py
  - src/readme_agent/commands.py
  - tests/
  - scripts/retrofits/
  - docs/architecture.md
  - plans/investigations/control/
  - plans/investigations/evidence/
  - logs/
  forbidden_paths:
  - production target repository remotes
  dependencies:
  - L8-MISSION-CONTROL-CONSUMER
  expected_outputs:
  - Versioned task goal_ids and core_contribution contracts with a graph/state migration
  - Validation requiring every nonterminal task to use known governed goal IDs and a concrete contribution
  - Durable dynamic-denominator lifecycle scoreboard and first-failing-boundary derivation
  - Status and transition enforcement that exposes the exact next task and rejects unevidenced drift closure
  - Goal bindings for every remaining task in the sole mission graph
  acceptance_checks:
  - GOAL-CORE-PRESENTABLE-PORTFOLIO remains active until complete mission closure.
  - Every remaining task binds one or more subordinate goals and one visible-output, blocker-removal,
    safety, or acceptance-proof contribution.
  - Status reports dynamic denominator and every required local lifecycle count from durable repository
    state.
  - Closing a machinery task without its evidenced contribution or corresponding scoreboard/blocker delta
    fails closed.
  - Restart and graph migration preserve the same scoreboard and next eligible task.
  verification:
  - Schema, loader, migration, graph-drift, selection, transition, scoreboard, and CLI status tests.
  - Representative truth, README, profile, autonomy, delivery, and maturity task bindings.
  - Real current runs/readme-poc state compared with the generated scoreboard.
  negative_controls:
  - Missing, unknown, generic, circular, or narrative-only goal bindings.
  - Schema/test/report/evidence existence used as the sole closure predicate.
  - Hard-coded registry denominator or stale narrative task used as current state.
  regression_checks:
  - mission load, claim, lease, transition, reconciliation, coverage, resume, and stop evaluation
  evidence_requirements:
  - Before/after graph and state schema
  - migrated task binding inventory
  - raw lifecycle input and generated scoreboard
  - rejected closure controls
  - restart result
  - checksums
  rollback_or_recovery: Preserve prior mission transition history, roll back only the goal-binding schema
    migration, and keep the core goal explicit in authority documents.
  failure_reroute: Repair schema/state migration first, then scoreboard derivation, then task binding
    gaps; never disable the guard to continue unrelated machinery work.
  closeout_rules:
  - All remaining tasks are machine-validated against the goal hierarchy.
  - The live status view identifies the core progress, first failing boundary, and exact next task.
  goal_ids:
  - GOAL-AUTONOMY
  core_contribution:
    kind: indispensable_safety
    summary: Add validated task goal/contribution bindings and a durable lifecycle scoreboard so selection,
      transition, and closure remain tied to the presentable full-portfolio deliverable.
  requirement_ids:
  - L8-025

    URL, awkward anchor, promotional landing page, duplicate link, and absent relevant article.
  - No guessed, cross-domain, empty-refresh, duplicate-truth, or catalog-disagreement URL becomes linkable.
  - No configured slot bypasses factual support, context binding, opening placement, or anti-promotion
    rules.
